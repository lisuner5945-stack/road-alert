name: Update camera database

on:
  schedule:
    # Ночью по UTC, когда публичные инстансы Overpass менее загружены.
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Разрешить резкое уменьшение числа камер (ручное подтверждение)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: camera-database
  cancel-in-progress: false

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Актуальные корневые сертификаты
        run: python -m pip install --quiet --upgrade certifi

      - name: Тесты pipeline (без них публикация не начинается)
        run: python -m unittest discover -s tools/osm -p "test_*.py" -v

      - name: Сборка базы из OpenStreetMap
        working-directory: tools/osm
        env:
          CAMERA_DB_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/database/camera_database.json.gz
        run: |
          python build_database.py \
            --output "$GITHUB_WORKSPACE/database" \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      - name: Проверка результата
        run: |
          set -e
          python - <<'PY'
          import gzip, json, pathlib
          base = pathlib.Path("database")
          metadata = json.loads((base / "metadata.json").read_text(encoding="utf-8"))
          payload = json.loads(gzip.decompress((base / "camera_database.json.gz").read_bytes()))
          assert metadata["camera_count"] == len(payload["cameras"]), "camera_count не совпадает"
          assert metadata["camera_count"] > 0, "пустая база"
          assert payload["license"] == "ODbL", "потеряна лицензия ODbL"
          print("OK:", metadata["camera_count"], "камер, версия", metadata["database_version"])
          PY

      - name: Публикация обновления
        run: |
          set -e
          if git diff --quiet -- database; then
            echo "База не изменилась — коммит не нужен"
            exit 0
          fi
          git config user.name "camera-db-bot"
          git config user.email "camera-db-bot@users.noreply.github.com"
          git add database
          git commit -m "chore(database): обновление базы камер из OpenStreetMap"
          git push

      - name: Артефакт для ручной проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-database
          path: database/
          if-no-files-found: ignore
